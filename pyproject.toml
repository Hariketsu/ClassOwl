[project]
name = "classowl"
version = "0.1.0"
description = "离线小学课程表工具"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "openpyxl>=3.1,<4",
  "ortools>=9.12,<10",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.2,<5",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "nuitka>=2.7,<3", "pyinstaller>=6.14,<7", "pytest>=8.4,<9"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.uv]
package = false
