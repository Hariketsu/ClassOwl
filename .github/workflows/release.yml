name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: uv run pytest -q
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build
      - run: npx tsc -p electron/tsconfig.json --noEmit

  build-mac:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run build:sidecar
      - run: npm --prefix frontend run build
      - run: npm run build:electron
      - run: npx electron-builder --mac zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: classowl-mac
          path: dist/*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm run build:sidecar
      - run: npm --prefix frontend run build
      - run: npm run build:electron
      - run: npx electron-builder --win nsis zip --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: classowl-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: classowl-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
